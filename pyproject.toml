[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-face-finder"
version = "0.1.0"
description = "Lokalne wyszukiwanie zdjęć zawierających wskazaną twarz"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "openai>=1.70,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "python-dotenv>=1.1,<2",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
